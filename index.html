<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clasificaciones">

<title>Colombofilia - Clasificaciones</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box}
html{margin:0;width:100%;min-height:100%;background:#fff;font-family:Poppins,Arial,sans-serif;overflow-x:hidden}body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;font-family:Poppins,Arial,sans-serif}
.app{min-height:100%;display:block;position:relative;background:#fff}
.views{position:relative;width:100%;min-height:100dvh;background:#fff;overflow:hidden;touch-action:pan-y;transition:height .28s ease}
.view{position:absolute;inset:0 auto auto 0;width:100%;display:block;transform:translate3d(100%,0,0);transition:transform .42s cubic-bezier(.22,.75,.2,1);will-change:transform;background:#fff}
iframe{display:block;width:100%;height:1px;border:0;background:#fff;overflow:hidden}
.tabs{position:fixed;z-index:9999;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:5px;padding:6px;border:1px solid rgba(255,255,255,.72);border-radius:9999px;background:rgba(242,244,248,.52);box-shadow:0 10px 32px rgba(20,35,60,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);overflow:hidden;isolation:isolate}
.tabs::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.10) 44%,rgba(255,255,255,.30));opacity:.8;z-index:0}
.tab-indicator{position:absolute;z-index:1;top:6px;left:0;height:calc(100% - 12px);border:1px solid rgba(255,255,255,.82);border-radius:9999px;background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(225,231,240,.34));box-shadow:0 4px 14px rgba(40,50,70,.13),inset 0 1px 1px rgba(255,255,255,.96),inset 0 -1px 0 rgba(255,255,255,.36);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);transition:transform .42s cubic-bezier(.22,.75,.2,1),width .42s cubic-bezier(.22,.75,.2,1);pointer-events:none}
.tab{position:relative;z-index:2;appearance:none;border:0;min-width:0;flex:1;background:transparent;color:rgba(60,60,67,.68);padding:8px 6px 7px;border-radius:9999px;font:600 11.5px Poppins,Arial,sans-serif;white-space:nowrap;cursor:pointer;transition:transform .18s ease,color .28s ease;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.15}.tab i{font-size:19px;line-height:1;transition:transform .28s cubic-bezier(.22,.75,.2,1)}.tab.active{color:#1c1c1e}.tab.active i{transform:translateY(-1px) scale(1.06)}
.tab:active{transform:scale(.97)}
@media (min-width:700px){.tabs{left:50%;right:auto;width:min(620px,calc(100% - 32px));transform:translateX(-50%)}.tab{font-size:13px}}
@media (max-width:390px){.tabs{left:max(7px,env(safe-area-inset-left));right:max(7px,env(safe-area-inset-right));gap:3px;padding:5px}.tab{padding:11px 5px;font-size:11.5px}.tab-indicator{top:5px;height:calc(100% - 10px)}}
@media print{.tabs{display:none}.app{height:auto}.views{padding-bottom:0;overflow:visible}.view{position:static!important;display:none!important;transform:none!important}.view.active{display:block!important}iframe{height:100vh}}

/* Tema de la aplicación: sigue automáticamente el modo de iOS/Safari. */
@media (prefers-color-scheme: dark){
 html,body,.app,.views,.view{background:#000!important;color:#f5f5f7}
 iframe{background:#000!important}
 .tabs{border-color:rgba(255,255,255,.16);background:rgba(34,34,38,.58);box-shadow:0 12px 36px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.05)}
 .tabs::before{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.025) 44%,rgba(255,255,255,.07));opacity:1}
 .tab-indicator{border-color:rgba(255,255,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.07));box-shadow:0 5px 18px rgba(0,0,0,.26),inset 0 1px 1px rgba(255,255,255,.20),inset 0 -1px 0 rgba(255,255,255,.06)}
 .tab{color:rgba(235,235,245,.60)}
 .tab.active{color:#fff}
}
/* Asentamiento Liquid Glass: rápido al iniciar, suave al encajar. */
.tab-indicator{transition:transform .46s cubic-bezier(.18,.89,.28,1.12),width .42s cubic-bezier(.2,.78,.2,1),box-shadow .28s ease,background .28s ease}
.view{transition:transform .46s cubic-bezier(.2,.78,.2,1),opacity .30s ease;opacity:.72}
.view.active{opacity:1}
.tab{transition:transform .20s cubic-bezier(.2,.8,.2,1),color .28s ease}
.tab i{transition:transform .34s cubic-bezier(.18,.89,.28,1.18),opacity .25s ease}
.tab.active i{transform:translateY(-1px) scale(1.075)}
@media (prefers-reduced-motion: reduce){.tab-indicator,.view,.tab,.tab i{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<main class="views">
<section class="view active" id="view-resultados"><iframe id="frame-resultados" title="Resultados"></iframe></section>
<section class="view" id="view-ruta"><iframe id="frame-ruta" title="Campeón de Ruta"></iframe></section>
<section class="view" id="view-as"><iframe id="frame-as" title="Paloma AS"></iframe></section>
</main>
<nav class="tabs" aria-label="Vistas">
<div class="tab-indicator" aria-hidden="true"></div>
<button class="tab active" data-target="resultados"><i class="fas fa-file-alt" aria-hidden="true"></i><span>Resultados</span></button>
<button class="tab" data-target="ruta"><i class="fas fa-trophy" aria-hidden="true"></i><span>Campeón de Ruta</span></button>
<button class="tab" data-target="as"><i class="fas fa-dove" aria-hidden="true"></i><span>Paloma AS</span></button>
</nav>
</div>
<script>
const pages={ruta:"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Campeón de Ruta</title>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\">\n    <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap\" rel=\"stylesheet\">\n    \n    <style>\n        /* Variables de Estilo basadas en tu diseño (combinación de colores y minimalismo) */\n        :root {\n            --primary-color: #4A90E2; /* Azul para títulos, bordes y elementos de diseño */\n            --secondary-color: #FF6B6B; \n            --background-color: #F7F9FC; /* Fondo muy claro */\n            --text-color: #333333; /* Texto oscuro */\n            --card-background: #ffffff;\n            --border-color: #FFFFFf; /* Borde gris muy claro */\n            --shadow-light: 0 0px 0px rgba(0, 0, 0, 0.05);\n            --shadow-medium: 0 0px 0px rgba(0, 0, 0, 0.1);\n            \n            /* Colores de la Tabla */\n            --table-header-bg: #0056b3; \n            --table-header-text: white;\n            --row-even-bg: #f5f5f5; \n            --row-odd-bg: #ffffff;  \n            \n            /* Colores de Resaltado */\n            --duplicate-highlight: #ffcdd2; \n            --duplicate-border: #d32f2f; \n            \n            /* NUEVA VARIABLE PARA TITULOS */\n            --title-color: #0056b3; \n            \n            /* NUEVA VARIABLE PARA RESALTADO TOP N */\n            --gold-highlight: #FFC300; \n        }\n\n        body {\n            font-family: 'Poppins', sans-serif;\n            margin: 0;\n            padding: 40px 20px; \n            background-color: #ffffff;\n            color: var(--text-color);\n            overflow-x: hidden; \n        }\n\n        /* ESTILO TÍTULO PRINCIPAL */\n        #main-title {\n            text-align: center;\n            color: var(--title-color); \n            font-weight: 800;\n            font-size: 2.5em;\n            letter-spacing: 2px;\n            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);\n            margin-top: 20px;\n            margin-bottom: 5px; \n            padding: 0 20px;\n        }\n        \n        /* ESTILO PARA LA LÍNEA DEBAJO DEL TÍTULO (90% Y CENTRADA) */\n        #title-divider {\n            border: none;\n            height: 3px; \n            background-color: var(--title-color); \n            width: 90%; \n            margin: 0 auto 30px auto; \n            border-radius: 5px; \n        }\n\n        h1 {\n            margin-top: 0;\n            font-weight: 700;\n            font-size: 2em;\n            color: var(--title-color); \n        }\n\n        #file-upload-section {\n            margin-bottom: 40px;\n            padding: 30px;\n            border: 1px solid var(--border-color);\n            border-radius: 15px;\n            background-color: var(--card-background);\n            box-shadow: var(--shadow-medium);\n            display: flex;\n            flex-direction: column;\n            gap: 20px;\n            border-left: 0px solid var(--primary-color);\n        }\n\n        /* ✨ CAMBIO CLAVE: Configuración de la columna única para todos los tamaños ✨ */\n        #controls-row {\n            display: flex;\n            flex-direction: column; \n            justify-content: flex-start;\n            align-items: stretch; /* Estira todos los elementos hijos al 100% del ancho */\n            flex-wrap: nowrap; \n            gap: 15px; \n        }\n        \n        .control-group {\n            display: flex;\n            gap: 10px;\n            flex-grow: 1; \n            min-width: 150px; \n            justify-content: center;\n            width: 100%; /* Asegura que el grupo ocupe todo el ancho */\n        }\n        /* FIN CAMBIO CLAVE */\n        \n        /* ESTILOS PARA EL SELECTOR MARCAS (EL RECUADRO) */\n        #top-n-selector {\n            padding: 2px 15px; \n            background-color: #007aff; \n            border: 0px solid var(--primary-color); \n            border-radius: 9999px;\n            box-shadow: var(--shadow-medium); \n            display: flex;\n            align-items: center;\n            gap: 10px;\n            font-weight: 600;\n            color: var(--text-color); \n            flex-grow: 1; \n            justify-content: center;\n            min-width: 150px;\n            transition: border-color 0.2s ease, box-shadow 0.2s ease;\n        }\n        \n        #calc-mode-selector {\n            padding: 2px 8px;\n            background-color: #007aff;\n            border-radius: 9999px;\n            display: flex;\n            align-items: center;\n            gap: 6px;\n            flex-grow: 1;\n            justify-content: center;\n            min-width: 190px;\n        }\n        #calc-mode-selector span { color:#fff; font-weight:600; }\n        .calc-mode-button {\n            padding: 8px 12px; border: 1px solid #007aff; background:#fff; color:#007aff;\n            border-radius:9999px; cursor:pointer; font-weight:600;\n        }\n        .calc-mode-button.active {\n            background:#007aff; color:#fff; border:3px solid var(--gold-highlight); padding:6px 10px;\n            box-shadow:0 4px 8px rgba(0,0,0,.3);\n        }\n\n        #top-n-selector:hover {\n            border-color: #0059c2; \n            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.15); \n        }\n        \n        /* Estilo para el texto \"Marcas:\" */\n        #top-n-selector span {\n            color: #ffffff; \n            font-weight: 600; \n        }\n        \n        .top-n-button {\n            padding: 8px 15px;\n            border: 1px solid var(--primary-color);\n            background-color: var(--card-background);\n            color: var(--primary-color);\n            border-radius: 9999px;\n            cursor: pointer;\n            transition: background-color 0.2s ease, transform 0.1s;\n            font-weight: 600;\n        }\n        \n        .top-n-button:hover {\n            background-color: #E6F0FF; \n        }\n        \n        /* ESTILO MODIFICADO PARA QUE EL BOTÓN SELECCIONADO SEA MÁS NOTORIO */\n        .top-n-button.active {\n            background-color: var(--primary-color);\n            color: white;\n            border: 3px solid var(--gold-highlight); \n            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); \n            padding: 6px 13px;\n        }\n        \n        .top-n-button.active:hover {\n            background-color: #0059c2; \n            transform: translateY(-1px);\n            border-color: var(--gold-highlight); \n        }\n\n        input[type=\"file\"] {\n            opacity: 0;\n            position: absolute;\n            z-index: -1;\n            width: 0.1px;\n            height: 0.1px;\n        }\n        \n        /* ESTILO BOTÓN CARGAR ARCHIVOS: #007aff */\n        .file-upload-label {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            padding: 10px 15px;\n            background-color: #007aff; \n            color: white;\n            border-radius: 9999px;\n            cursor: pointer;\n            transition: background-color 0.3s ease, transform 0.1s;\n            font-weight: 600;\n            white-space: nowrap;\n            box-shadow: var(--shadow-light);\n            flex-grow: 1;\n            justify-content: center;\n        }\n\n        .file-upload-label:hover {\n            background-color: #0059c2; \n            transform: translateY(-1px);\n        }\n\n        .summary-box {\n            background-color: #F0F5FF;\n            border: 0px solid var(--primary-color);\n            margin: 0;\n            padding: 10px 15px;\n            border-radius: 9999px;\n            font-size: 1.1em;\n            font-weight: 500;\n            color: var(--text-color);\n        }\n\n        /* Estilos de botones generales */\n        #printButton, #clearDataButton {\n            padding: 10px 15px;\n            border: none;\n            border-radius: 9999px;\n            cursor: pointer;\n            transition: background-color 0.3s ease, transform 0.1s;\n            font-weight: 600;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            box-shadow: var(--shadow-light);\n            font-size: 1em;\n            white-space: nowrap;\n            width: 100%; /* Asegura que ocupen el ancho completo */\n            justify-content: center;\n        }\n        \n        /* ESTILO BOTÓN DESCARGAR HTML: #27a844 */\n        #printButton {\n            background-color: #27a844; \n            color: white;\n        }\n        #printButton:hover {\n            background-color: #1f8435; \n            transform: translateY(-1px);\n        }\n        \n        /* ESTILO BOTÓN BORRAR HISTORIAL: #dc3546 */\n        #clearDataButton {\n            background-color: #dc3546; \n            color: white;\n        }\n        #clearDataButton:hover {\n            background-color: #b02a3a; \n            transform: translateY(-1px);\n        }\n\n        /* INICIO: Estilo de tabla general (minimalista y limpio) */\n        table {\n            border-collapse: separate; \n            border-spacing: 0;         \n            width: 100%;\n            margin-top: 0;\n            box-shadow: var(--shadow-light); \n            background-color: var(--card-background);\n            border-radius: 0.25rem; \n            border: 1px solid var(--border-color);\n            font-family: 'Poppins', sans-serif; \n        }\n        \n        /* Contenedor de la tabla resumen para scroll horizontal si es necesario */\n        #summaryTable {\n             overflow-x: auto; \n        }\n        #summaryTable table {\n            width: 100%;\n            min-width: fit-content; \n        }\n\n        th, td {\n            border: 1px solid var(--border-color); \n            border-width: 0 1px 1px 0; \n            padding: 10px 15px; \n            text-align: left;\n            font-family: 'Poppins', sans-serif;\n            font-size: 0.9em; \n            color: var(--text-color);\n            font-weight: 400; \n            text-transform: none; \n            letter-spacing: normal;\n        }\n\n        th {\n            background-color: var(--table-header-bg); \n            color: var(--table-header-text); \n            font-weight: 600;\n            position: sticky; \n            top: 0;\n            z-index: 10;\n            border-top: none; \n            vertical-align: top; \n            white-space: nowrap; \n        }\n\n        /* Encabezado de Posición (1ª columna) */\n        #summaryTable th:nth-child(1) {\n            padding: 10px 15px;\n            width: 1px;\n        }\n\n        /* Filas con fondo alterno */\n        #summaryTable tr:nth-child(even) { \n            background-color: var(--row-even-bg) !important;\n        }\n        #summaryTable tr:nth-child(odd) { \n            background-color: var(--row-odd-bg) !important;\n        }\n        \n        \n        /* Resaltado de duplicados (Ahora usado para resaltar filas de la carga actual) */\n        .highlight-duplicate {\n            background-color: inherit !important; \n            color: inherit !important;\n        }\n\n        .row-duplicate {\n            /* Usamos este borde para las filas que tienen datos en la carga actual */\n            border-left: 5px solid var(--primary-color); \n            transition: background-color 0.2s;\n        }\n\n        /* Añadir un hover para las filas duplicadas que mantenga la alternancia */\n        .row-duplicate:hover {\n            background-color: #e6f0ff !important; \n        }\n\n        /* INICIO: Estilos específicos de la Tabla de Resumen */\n        \n        /* Encabezados de Archivo (\"file-header\") y \"Total Histórico\" */\n        .file-header,\n        #summaryTable th.total-score { \n            writing-mode: horizontal-tb;\n            transform: none; \n            padding: 10px 10px;\n            height: auto; \n            max-width: 150px; \n            white-space: normal; \n            word-wrap: break-word; \n            overflow-wrap: break-word; \n            font-size: 0.9em; \n            font-weight: 600;\n            text-align: center; \n            border-left: 1px solid var(--border-color); \n        }\n        \n        /* Columna de Posición (datos) - 1ª columna - CON NEGRITAS */\n        #summaryTable td:nth-child(1) {\n            text-align: center;\n            font-weight: 700; \n            padding: 10px 15px; \n            border-right: 1px solid var(--border-color); \n            width: 1%; \n            white-space: nowrap;\n            font-size: 0.9em; \n        }\n        \n        /* Columna de ID (2ª) - SIN NEGRITAS */\n        #summaryTable td:nth-child(2) {\n            white-space: nowrap;\n            text-align: center;\n            font-weight: 400; \n        }\n        \n        /* Columna Total Histórico (última) - SIN NEGRITAS */\n        #summaryTable td:last-child {\n            white-space: nowrap;\n            text-align: center;\n            font-weight: 400; \n        }\n        \n        /* Columnas de Archivo (datos) - Ahora inician en la 3ª posición */\n        #summaryTable td:nth-child(n+3):not(:last-child) {\n            text-align: center;\n            white-space: nowrap;\n            font-weight: 400; \n        }\n\n        /* ESTILOS MÓVILES - Se mantiene la columna única forzada arriba */\n        @media (max-width: 600px) {\n            #controls-row {\n                gap: 10px; \n            }\n            #printButton, #clearDataButton, .file-upload-label, .control-group {\n                width: 100%;\n                justify-content: center;\n                flex-grow: 1; \n            }\n            .top-n-button {\n                flex-grow: 1;\n                text-align: center;\n            }\n        }\n        /* FIN: Estilo de tabla minimalista */\n\n        /* Reglas de impresión ajustadas */\n        @media print {\n            body * { visibility: hidden; }\n            #summaryTable, #summaryTable * { visibility: visible; }\n            #summaryTableContainer { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0 5px; box-shadow: none; overflow-x: auto; }\n            #summaryTable table { \n                border: 1px solid #000; \n                box-shadow: none; \n                width: 100%; \n                min-width: max-content; \n                font-family: 'Poppins', sans-serif; \n            }\n            \n            #summaryTable th, #summaryTable td { \n                border: 1px solid #666 !important; \n                background-color: white !important;\n                font-size: 9pt !important; \n                padding: 3px 5px !important; \n                height: auto !important; \n                color: black !important; \n                font-weight: 400 !important; \n                white-space: normal !important; \n                text-align: center !important; \n                font-family: 'Poppins', sans-serif !important; \n                text-transform: none !important;\n                letter-spacing: normal !important;\n            }\n            \n            #summaryTable th {\n                background-color: var(--table-header-bg) !important; \n                color: var(--table-header-text) !important; \n                font-weight: 600 !important; \n            }\n\n            /* Alternancia de filas en impresión - MODIFICADO */\n            #summaryTable tr:nth-child(even) { \n                background-color: #f0f0f0 !important; \n            }\n            #summaryTable tr:nth-child(odd) { \n                background-color: white !important;\n            }\n            \n            /* Encabezados horizontales */\n            #summaryTable th { \n                writing-mode: horizontal-tb !important;\n                transform: none !important;\n                max-width: 100px !important; \n                font-size: 8pt !important;\n            }\n            \n            /* Posición, ID y Total Histórico */\n            #summaryTable th:nth-child(1),\n            #summaryTable th:nth-child(2),\n            #summaryTable th:last-child {\n                max-width: 50px !important;\n                min-width: 50px !important;\n            }\n            \n            /* Datos de Posición (con negritas en impresión) */\n            #summaryTable td:nth-child(1) \n            {\n                 width: 15px !important; \n                 white-space: nowrap !important;\n                 text-align: center !important;\n                 border-right: 1px solid #666 !important;\n                 font-weight: 700 !important; \n            }\n            \n            /* Datos de ID (2ª) y Total Histórico (última) - SIN NEGRITAS */\n            #summaryTable td:nth-child(2),\n            #summaryTable td:last-child\n            {\n                 white-space: nowrap !important;\n                 text-align: center !important;\n                 border-right: 1px solid #666 !important;\n                 font-weight: 400 !important; \n            }\n            \n            /* Datos de Archivo (Ahora inician en la 3ª posición) */\n            #summaryTable td:nth-child(n+3):not(:last-child) {\n                 font-family: 'Poppins', sans-serif !important; \n            }\n            \n            th, td { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; }\n            #printButton, #clearDataButton, .file-upload-label, #controls-row, #file-upload-section, .file-input-container { display: none !important; } \n        }\n    </style>\n    \n</head>\n<body>\n\n    <h1 id=\"main-title\">CAMPEON DE RUTA</h1>\n    <hr id=\"title-divider\"> \n\n<div id=\"file-upload-section\">\n        \n\n        \n        <div id=\"controls-row\">\n            \n            <div class=\"control-group file-input-container\">\n                 <input type=\"file\" id=\"excelFile\" accept=\".xlsx, .xls\" multiple>\n                 <label for=\"excelFile\" class=\"file-upload-label\" id=\"fileUploadLabel\">\n                    <i class=\"fas fa-file-excel\" style=\"color: white;\"></i>\n                    <span>Seleccionar Archivo</span>\n                 </label>\n            </div>\n            \n            <div class=\"control-group\">\n                <div id=\"top-n-selector\">\n                    <span>Marcas:</span>\n                    <button class=\"top-n-button\" data-value=\"1\">1</button>\n                    <button class=\"top-n-button\" data-value=\"2\">2</button>\n                    <button class=\"top-n-button active\" data-value=\"3\">3</button>\n                    <button class=\"top-n-button\" data-value=\"4\">4</button>\n                </div>\n            </div>\n            \n            <div class=\"control-group\">\n                <div id=\"calc-mode-selector\">\n                    <button class=\"calc-mode-button active\" data-mode=\"speed\">Velocidad</button>\n                    <button class=\"calc-mode-button\" data-mode=\"points\">Puntos</button>\n                </div>\n            </div>\n            \n            <button id=\"printButton\"><i class=\"fas fa-download\"></i> Descargar HTML</button>\n            \n            <button id=\"clearDataButton\"><i class=\"fas fa-trash-alt\"></i> Borrar Historial</button>\n            <p class=\"summary-box\" id=\"summary\">Historial: <strong>0 cargas</p>\n            \n        </div>\n    </div>\n\n    <div id=\"summaryTableContainer\">\n        <div id=\"summary-controls\">\n            <h2 class=\"summary-title\"></h2> \n        </div>\n        \n        <div id=\"summaryTable\">\n            <p>Sube un archivo para comenzar a calcular el Campeón de Ruta.</p>\n        </div>\n    </div>\n    \n    <script>\n        document.getElementById('excelFile').addEventListener('change', handleFiles, false);\n        document.getElementById('clearDataButton').addEventListener('click', clearData, false);\n        document.getElementById('printButton').addEventListener('click', downloadSummaryHtml, false);\n        \n        // --- NUEVOS LISTENERS PARA LOS BOTONES TOP N ---\n        document.querySelectorAll('.top-n-button').forEach(button => {\n            button.addEventListener('click', handleTopNButtonClick);\n        });\n        document.querySelectorAll('.calc-mode-button').forEach(button => {\n            button.addEventListener('click', handleCalcModeClick);\n        });\n        // --- FIN NUEVOS LISTENERS ---\n\n        // --- CONSTANTES GLOBALES (Necesarias para la lógica) ---\n        const LOCAL_STORAGE_KEY = 'pigeonRaceHistory';\n        // Índice de la columna del Socio/ID (Columna N en Excel, índice 13)\n        const COLUMNA_SOCIO_INDEX = 13; \n        // Índice de la columna del Valor de Velocidad (Columna S en Excel, índice 18)\n        const COLUMNA_VALOR_INDEX = 18; \n        // Índice de la columna del Nombre/Descripción (Usaremos Columna B en Excel, índice 1)\n        const COLUMNA_NOMBRE_INDEX = 1; \n\n        let TOP_N = 3;\n        let CALC_MODE = 'speed';\n        let dataRowsCache = null; \n        let history = {}; \n        let sortedSociosData = []; // NUEVA VARIABLE para almacenar los datos ordenados finales\n\n        const summaryTableDiv = document.getElementById('summaryTable');\n        const summaryElement = document.getElementById('summary');\n        const fileUploadLabel = document.getElementById('fileUploadLabel').querySelector('span');\n\n        // ----------------- Carga, Guardado y Limpieza -----------------\n        \n        function saveData() {\n            try {\n                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(history));\n                localStorage.setItem('topNValue', TOP_N.toString());\n                localStorage.setItem('campeonRutaCalcMode', CALC_MODE);\n            } catch (error) {\n                console.error(\"Error al guardar datos en localStorage:\", error);\n            }\n        }\n\n        function clearLocalStorage() {\n             localStorage.removeItem(LOCAL_STORAGE_KEY);\n        }\n        \n        function loadData() {\n            try {\n                const storedHistory = localStorage.getItem(LOCAL_STORAGE_KEY);\n                const storedTopN = localStorage.getItem('topNValue');\n                const storedCalcMode = localStorage.getItem('campeonRutaCalcMode');\n\n                if (storedHistory) {\n                    history = JSON.parse(storedHistory);\n                }\n                \n                if (storedTopN) {\n                    TOP_N = parseInt(storedTopN, 10);\n                }\n                if (storedCalcMode === 'speed' || storedCalcMode === 'points') {\n                    CALC_MODE = storedCalcMode;\n                }\n                \n            } catch (error) {\n                console.error(\"Error al cargar datos de localStorage:\", error);\n                clearLocalStorage();\n            }\n            \n            // Llama a la nueva función para actualizar la UI de los botones\n            updateTopNButtonsUI(TOP_N); \n            updateCalcModeUI();\n            \n            updateSummary();\n            displayFinalResultsWithHistory(null); \n        }\n\n        function clearData() {\n            if (!confirm('¿Estás seguro de que quieres borrar todos los datos acumulados y empezar de nuevo?')) {\n                return;\n            }\n            clearLocalStorage();\n            \n            history = {};\n            dataRowsCache = null;\n            sortedSociosData = []; // Limpiar datos de resultados\n            \n            updateTopNButtonsUI(TOP_N); // Conserva el número de marcas seleccionado\n            updateSummary();\n            fileUploadLabel.textContent = \"Seleccionar Archivo\";\n            displayEmptyMessage();\n            \n            alert('Datos reiniciados.');\n        }\n        \n        function updateSummary() {\n            const historyCount = Object.keys(history).length;\n            summaryElement.innerHTML = `Historial: <strong>${historyCount} cargas`;\n        }\n\n        // ----------------- Manejo de Archivos y Eventos -----------------\n\n        // --- NUEVA FUNCIÓN PARA EL MANEJO DE BOTONES TOP N ---\n        function updateTopNButtonsUI(newN) {\n            document.querySelectorAll('.top-n-button').forEach(button => {\n                if (parseInt(button.dataset.value, 10) === newN) {\n                    button.classList.add('active');\n                } else {\n                    button.classList.remove('active');\n                }\n            });\n        }\n        \n        function handleTopNButtonClick(e) {\n            const newN = parseInt(e.target.dataset.value, 10);\n            if (!isNaN(newN) && newN >= 1 && newN !== TOP_N) {\n                TOP_N = newN;\n                saveData(); \n                updateTopNButtonsUI(TOP_N); // Update UI\n                displayFinalResultsWithHistory(null); \n            }\n        }\n        // --- FIN NUEVA FUNCIÓN ---\n\n        function updateCalcModeUI() {\n            document.querySelectorAll('.calc-mode-button').forEach(button => {\n                button.classList.toggle('active', button.dataset.mode === CALC_MODE);\n            });\n        }\n\n        function handleCalcModeClick(e) {\n            const mode = e.currentTarget.dataset.mode;\n            if ((mode === 'speed' || mode === 'points') && mode !== CALC_MODE) {\n                CALC_MODE = mode;\n                saveData();\n                updateCalcModeUI();\n                displayFinalResultsWithHistory(null);\n            }\n        }\n\n        function handleFiles(e) {\n            const files = e.target.files;\n            if (files.length === 0) {\n                fileUploadLabel.textContent = \"Seleccionar Archivo\";\n                return;\n            }\n            \n            fileUploadLabel.textContent = `Cargando ${files.length} archivo(s)...`;\n            summaryTableDiv.innerHTML = `<p>Cargando y procesando...</p>`;\n\n\n            const filePromises = Array.from(files).map(file => {\n                return new Promise((resolve, reject) => {\n                    const reader = new FileReader();\n                    \n                    reader.onload = function(e) {\n                        try {\n                            const data = new Uint8Array(e.target.result);\n                            const workbook = XLSX.read(data, {type: 'array'});\n                            const firstSheetName = workbook.SheetNames[0];\n                            const worksheet = workbook.Sheets[firstSheetName];\n                            \n                            // Obtiene los datos como un array de arrays (filas)\n                            const sheetData = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: true});\n                            resolve({ sheetData, fileName: file.name }); \n                        } catch (error) {\n                            // Error al parsear el archivo\n                            reject(new Error(`Error al procesar \"${file.name}\". Asegúrate de que sea un archivo Excel válido (.xlsx o .xls).`));\n                        }\n                    };\n                    \n                    reader.onerror = function(e) {\n                        // Error de lectura (permisos o disco)\n                         reject(new Error(`Error de lectura en el archivo \"${file.name}\". Verifique los permisos.`));\n                    }\n                    \n                    reader.readAsArrayBuffer(file);\n                });\n            });\n\n            Promise.all(filePromises)\n                .then(allDataResults => {\n                    let totalNewRows = 0;\n                    let lastResults = null;\n                    let allRowsForCache = [];\n\n                    allDataResults.forEach(result => {\n                        const { sheetData, fileName } = result;\n\n                        if (sheetData.length > 1) {\n                            // La primera fila son encabezados, el resto son datos\n                            const dataRows = sheetData.slice(1); \n                            totalNewRows += dataRows.length;\n                            \n                            // 1. Encontrar IDs únicos de socios\n                            const sociosUnicos = new Set(dataRows.map(row => String(row[COLUMNA_SOCIO_INDEX] || '').trim()).filter(id => id !== ''));\n                            \n                            // 2. Calcular ambos métodos sin alterar el cálculo original de Velocidad\n                            const currentResults = calculateTopNAverage(dataRows, Array.from(sociosUnicos));\n                            const pointResults = calculateTopNPoints(dataRows, Array.from(sociosUnicos));\n                            const pointMap = new Map(pointResults.map(item => [item.socio, item]));\n                            currentResults.forEach(item => {\n                                const p = pointMap.get(item.socio);\n                                item.promedioPuntos = p ? p.promedioTopN : 0;\n                                item.sumaPuntos = p ? p.sumaTopN : 0;\n                            });\n                            \n                            // 3. Preparar datos para guardar en el historial\n                            const timestamp = Date.now().toString();\n                            const resultsForHistory = {};\n                            const pointResultsForHistory = {};\n                            const cleanedFileName = fileName.replace(/\\.[^/.]+$/, \"\"); // Quita la extensión\n                            \n                            // Evitar colisiones si se cargan múltiples archivos en el mismo milisegundo\n                            let uniqueTimestamp = timestamp;\n                            let counter = 0;\n                            while(history.hasOwnProperty(uniqueTimestamp)) {\n                                uniqueTimestamp = timestamp + '_' + (++counter);\n                            }\n                            \n                            currentResults.forEach(item => {\n                                // Guardamos el promedio (el valor que se suma)\n                                resultsForHistory[item.socio] = item.promedioTopN; \n                                pointResultsForHistory[item.socio] = item.promedioPuntos;\n                            });\n\n                            history[uniqueTimestamp] = {\n                                fileName: cleanedFileName,\n                                results: resultsForHistory,\n                                pointResults: pointResultsForHistory\n                            };\n                            \n                            lastResults = currentResults;\n                            allRowsForCache = sheetData; // Guardamos la última tabla completa para el caché\n                        }\n                    });\n                    \n                    if (totalNewRows > 0) {\n                        dataRowsCache = allRowsForCache; // Actualiza el caché de la última carga\n                        saveData(); \n                        displayFinalResultsWithHistory(lastResults); \n                    } else {\n                        summaryTableDiv.innerHTML = `<p>No se encontraron datos válidos.</p>`;\n                    }\n                    \n                    updateSummary();\n                    fileUploadLabel.textContent = `Archivos cargados: ${files.length}`;\n\n                })\n                .catch(error => {\n                    // Muestra el error de parseo o lectura\n                    summaryTableDiv.innerHTML = `<p style=\"color: red; font-weight: 600;\">Error al procesar archivo(s).</p>`;\n                    \n                    // Intenta re-mostrar el historial si existe\n                    displayFinalResultsWithHistory(null);\n                    \n                    updateSummary();\n                    fileUploadLabel.textContent = `Error al cargar`;\n                });\n            \n            e.target.value = null; \n        }\n\n        // ----------------- FUNCIONES DE CÁLCULO Y LECTURA -----------------\n\n        /**\n         * Calcula el promedio de los TOP N valores más altos para cada socio\n         * en la carga de datos actual.\n         * @param {Array<Array<any>>} dataRows - Las filas de datos del archivo Excel (sin encabezados).\n         * @param {Array<string>} sociosUnicos - Lista de IDs únicos de los socios.\n         * @returns {Array<{socio: string, sumaTopN: number, promedioTopN: number}>} Resultados de la carga actual.\n         */\n        function calculateTopNAverage(dataRows, sociosUnicos) {\n            const resultadosFinales = [];\n\n            sociosUnicos.forEach(socioID => {\n                let valoresSocio = [];\n\n                dataRows.forEach(row => {\n                    if (String(row[COLUMNA_SOCIO_INDEX]).trim() === socioID) {\n                        const valor = parseFloat(row[COLUMNA_VALOR_INDEX]);\n                        if (!isNaN(valor)) {\n                            valoresSocio.push(valor);\n                        }\n                    }\n                });\n\n                // 1. Ordenar de forma descendente (el más alto primero)\n                valoresSocio.sort((a, b) => b - a); \n                \n                // 2. Tomar solo los primeros TOP_N valores (las mejores marcas)\n                const valoresATomar = valoresSocio.slice(0, TOP_N); \n                let promedio = 0;\n                let suma = 0;\n\n                if (valoresATomar.length > 0) {\n                    suma = valoresATomar.reduce((acc, val) => acc + val, 0);\n                    \n                    // 🚨 CAMBIO CLAVE AQUÍ: La suma siempre se divide por TOP_N\n                    // Si un socio tiene menos de TOP_N marcas, la suma de las disponibles\n                    // se penaliza al dividirse por el número de marcas seleccionadas (TOP_N).\n                    promedio = suma / TOP_N;\n                }\n\n                resultadosFinales.push({\n                    socio: socioID,\n                    sumaTopN: suma,\n                    promedioTopN: promedio \n                });\n            });\n\n            return resultadosFinales;\n        }\n\n\n        function calculateTopNPoints(dataRows, sociosUnicos) {\n            let primeraVelocidad = 0;\n            dataRows.forEach(row => {\n                const v = parseFloat(row[COLUMNA_VALOR_INDEX]);\n                if (!isNaN(v) && v > primeraVelocidad) primeraVelocidad = v;\n            });\n            return sociosUnicos.map(socioID => {\n                const puntos = [];\n                dataRows.forEach(row => {\n                    if (String(row[COLUMNA_SOCIO_INDEX]).trim() === socioID) {\n                        const velocidad = parseFloat(row[COLUMNA_VALOR_INDEX]);\n                        if (!isNaN(velocidad) && primeraVelocidad > 0) puntos.push((velocidad * 1000) / primeraVelocidad);\n                    }\n                });\n                puntos.sort((a,b) => b-a);\n                const mejores = puntos.slice(0, TOP_N);\n                const suma = mejores.reduce((a,b) => a+b, 0);\n                return { socio:socioID, sumaTopN:suma, promedioTopN: mejores.length ? suma / TOP_N : 0 };\n            });\n        }\n\n        // ----------------- FUNCIÓN DE VISUALIZACIÓN Y CONSOLIDACIÓN -----------------\n\n        function displayEmptyMessage() {\n            summaryTableDiv.innerHTML = `<p>Sube un archivo para comenzar a calcular el Campeón de Ruta</p>`;\n        }\n\n        /**\n         * Consolidar los resultados actuales con el historial guardado y generar la tabla final.\n         * Ordena a los socios basándose en la Suma Total Histórica.\n         * @param {Array<{socio: string, sumaTopN: number, promedioTopN: number}> | null} currentResults - Resultados de la última carga.\n         */\n        function displayFinalResultsWithHistory(currentResults) {\n            const allSocios = new Set();\n            // historyKeys se ordena alfabéticamente/cronométricamente (por timestamp)\n            let historyKeys = Object.keys(history).sort(); \n\n            // 1. Recopilar todos los socios únicos\n            (currentResults || []).forEach(item => {\n                allSocios.add(item.socio);\n            });\n            historyKeys.forEach(key => {\n                Object.keys(history[key].results || {}).forEach(socio => {\n                    allSocios.add(socio);\n                });\n            });\n            \n\n            const currentResultsMap = new Map((currentResults || []).map(item => [item.socio, CALC_MODE === 'points' ? { promedio: item.promedioPuntos, suma: item.sumaPuntos } : { promedio: item.promedioTopN, suma: item.sumaTopN }]));\n\n            // 2. Calcular la Suma Total Histórica para cada socio\n            const historicalSumMap = new Map();\n            Array.from(allSocios).forEach(socio => {\n                let totalHistoricalSum = historyKeys.reduce((sum, key) => { const r = CALC_MODE === 'points' ? (history[key].pointResults || {}) : (history[key].results || {}); return sum + (r[socio] || 0); }, 0);\n                historicalSumMap.set(socio, totalHistoricalSum);\n            });\n\n            // 3. Ordenar a los socios por Suma Total Histórica (descendente)\n            let sortedSocios = Array.from(allSocios).sort((socioA, socioB) => {\n                const sumA = historicalSumMap.get(socioA) || 0;\n                const sumB = historicalSumMap.get(socioB) || 0;\n\n                // Criterio de desempate: si la suma histórica es igual, usar la suma de la carga actual (si existe).\n                if (Math.abs(sumA - sumB) < 0.0001) { \n                    const currentSumA = currentResultsMap.get(socioA)?.suma || -Infinity;\n                    const currentSumB = currentResultsMap.get(socioB)?.suma || -Infinity;\n                    \n                    if (currentSumA !== -Infinity || currentSumB !== -Infinity) {\n                       return currentSumB - currentSumA;\n                    }\n                }\n                \n                return sumB - sumA;\n            });\n\n            if (sortedSocios.length === 0) {\n                 displayEmptyMessage();\n                 return;\n            }\n            \n            // Almacenar los resultados finales en la variable global\n            sortedSociosData = sortedSocios.map((socioID, i) => ({\n                posicion: i + 1,\n                socioID: socioID,\n                total: historicalSumMap.get(socioID),\n                promedios: historyKeys.map(key => { const r = CALC_MODE === 'points' ? (history[key].pointResults || {}) : (history[key].results || {}); return r[socioID] !== undefined ? r[socioID] : null; })\n            }));\n\n\n            // 4. Generación del HTML de la tabla\n            const fileHeaders = historyKeys.map(key => history[key].fileName);\n\n            let html = `<table><thead><tr>`;\n            \n            html += `<th>#</th>`; // <---- ENCABEZADO DE POSICIÓN\n            html += `<th>Socio/Miembro</th>`; \n            \n            fileHeaders.forEach((fileName) => {\n                html += `<th class=\"file-header\">${fileName}</th>`;\n            });\n\n            html += `<th class=\"total-score\">${CALC_MODE === 'points' ? 'Puntos' : 'Velocidad'}</th>`; \n\n            html += '</tr></thead><tbody>';\n\n            sortedSociosData.forEach((item) => {\n                const { posicion, socioID, total, promedios } = item;\n                \n                // Aplicamos la clase de resaltado a toda la fila para la carga actual\n                const rowClass = currentResultsMap.has(socioID) ? 'row-duplicate' : ''; \n\n                html += `<tr class=\"${rowClass}\">`; \n                \n                // TD Posición (Contenido con el número de posición)\n                html += `<td>${posicion}</td>`;\n                // TD Socio/ID - Quitamos el estilo inline 'font-weight: 600;'\n                html += `<td>${socioID}</td>`; \n                \n                // TDs Archivos (Ahora son la 3ª, 4ª, etc.)\n                promedios.forEach(avg => {\n                    /* Usar toFixed(3) para 3 decimales */\n                    const avgContent = avg !== null ? avg.toFixed(3) : '-'; \n                    html += `<td style=\"text-align: center;\">${avgContent}</td>`;\n                });\n                \n                // TD Puntuación Total - Quitamos el estilo inline 'font-weight: 600;'\n                html += `<td class=\"total-score\">${total.toFixed(3)}</td>`; \n\n                html += '</tr>';\n            });\n\n            html += '</tbody></table>';\n            summaryTableDiv.innerHTML = html;\n        }\n\n        // ----------------- Funciones de Descarga (HTML) -----------------\n        \n        /**\n         * Función genérica para descargar archivos, maneja Android vs. Navegador.\n         * @param {string} content - Contenido del archivo.\n         * @param {string} fileName - Nombre del archivo COMPLETO con extensión (.html).\n         */\n        function downloadFile(content, fileName) {\n            // MIME Type para HTML\n            const htmlMimeType = 'text/html;charset=utf-8';\n            \n            if (window.Android && typeof window.Android.saveFile === 'function') {\n                console.log(\"Modo App Android detectado. Llamando a Kotlin...\");\n                // Codifica el contenido a Base64\n                const contentBase64 = btoa(unescape(encodeURIComponent(content)));\n                // Pasa el nombre de archivo COMPLETO con extensión para forzar el tipo en Android\n                window.Android.saveFile(contentBase64, fileName); \n            } else {\n                // Modo Navegador: descarga estándar\n                console.log(\"Modo Navegador detectado. Usando descarga estándar.\");\n                const blob = new Blob([content], { type: htmlMimeType }); \n                const a = document.createElement('a');\n                a.href = URL.createObjectURL(blob);\n                \n                // Se usa el fileName COMPLETO\n                a.download = fileName; \n\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                \n                URL.revokeObjectURL(a.href);\n            }\n        }\n        \n        // Función de descarga HTML (existente, con nombre de archivo modificado)\n        function downloadSummaryHtml() {\n            const summaryContent = document.getElementById('summaryTable').innerHTML; \n            if (summaryContent.includes(\"Sube un archivo\")) {\n                alert(\"No hay datos para descargar. Por favor, sube un archivo Excel primero.\");\n                return;\n            }\n\n            const mainTitle = \"CAMPEON DE RUTA\"; \n            \n            // Definimos el nombre del archivo COMPLETO aquí\n            const nombreArchivoCompleto = \"Campeon de Ruta.html\"; \n            \n            // CSS interno (simplificado para descarga)\n            const internalCss = `\n                body { font-family: 'Poppins', sans-serif; margin: 20px; color: #333; background-color: #ffffff; }\n                .summary-title-download { color: #0056b3; font-weight: 800; font-size: 2.5em; margin-bottom: 5px; text-align: center; }\n                .title-divider-download { border: none; height: 3px; background-color: #0056b3; width: 90%; margin: 0 auto 30px auto; border-radius: 5px; }\n                table { border-collapse: separate; border-spacing: 0; width: 100%; box-shadow: none; background-color: white; border: 1px solid #E0E6ED; font-family: 'Poppins', sans-serif; }\n                th, td { border: 1px solid #E0E6ED; padding: 10px 15px; text-align: center; font-size: 0.9em; color: #333; border-width: 0 1px 1px 0; font-weight: 400; font-family: 'Poppins', sans-serif; text-transform: none; letter-spacing: normal; }\n                th { background-color: #0056b3; color: white; font-weight: 600; white-space: nowrap; border-top: none; vertical-align: top; }\n                /* ESTILO INTERCALADO PARA DESCARGA - GRIS CLARO */\n                tr:nth-child(even) { background-color: #f5f5f5 !important; } \n                tr:nth-child(odd) { background-color: #ffffff !important; }\n                \n                .row-duplicate { border-left: 5px solid #4A90E2; }\n                \n                /* Estilos específicos para la tabla de resumen descargada */\n                #summaryTable td:nth-child(1) { font-weight: 700; text-align: center; width: 1%; white-space: nowrap; }\n                /* Quitamos negrita del socio/miembro y total para descarga */\n                #summaryTable td:nth-child(2),\n                #summaryTable td:last-child { font-weight: 400; white-space: nowrap; text-align: center; } \n                \n                .file-header, #summaryTable th.total-score { writing-mode: horizontal-tb; transform: none; padding: 10px 10px; height: auto; max-width: 150px; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; font-size: 0.9em; font-weight: 600; text-align: center; border-left: 1px solid #E0E6ED; }\n                /* Promedios (Ahora inician en la 3ª posición) */\n                #summaryTable td:nth-child(n+3):not(:last-child) { font-family: 'Poppins', sans-serif; } \n            `;\n            \n            // Re-generamos el contenido de la tabla para asegurarnos de que el formato sea de 3 decimales en la descarga\n            const downloadTableHtml = generateDownloadTableHtml();\n\n            const htmlContent = `\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>${mainTitle}</title> \n    <style>${internalCss}</style>\n</head>\n<body>\n    <h1 class=\"summary-title-download\">${mainTitle}</h1> \n    <hr class=\"title-divider-download\">\n    <div id=\"summaryTable\">\n        ${downloadTableHtml}\n    </div>\n</body>\n</html>\n            `;\n            \n            // Llamamos a downloadFile con el nombre del archivo completo\n            downloadFile(htmlContent, nombreArchivoCompleto);\n        }\n        \n        // --- FUNCIÓN ADICIONAL PARA GENERAR HTML DE DESCARGA CON 3 DECIMALES ---\n        function generateDownloadTableHtml() {\n            if (sortedSociosData.length === 0) {\n                 return \"<table><tbody><tr><td>No hay datos históricos para mostrar.</td></tr></tbody></table>\";\n            }\n            \n            const fileHeaders = Object.keys(history).sort().map(key => history[key].fileName);\n\n            let html = `<table><thead><tr>`;\n            \n            html += `<th>#</th>`; \n            html += `<th>Socio/Miembro</th>`; \n            \n            fileHeaders.forEach((fileName) => {\n                html += `<th class=\"file-header\">${fileName}</th>`;\n            });\n\n            html += `<th class=\"total-score\">Total</th>`; \n\n            html += '</tr></thead><tbody>';\n\n            sortedSociosData.forEach((item) => {\n                const { posicion, socioID, total, promedios } = item;\n                \n                html += `<tr>`; \n                \n                html += `<td>${posicion}</td>`;\n                // TD Socio/ID - Sin estilo inline de negrita\n                html += `<td>${socioID}</td>`; \n                \n                promedios.forEach(avg => {\n                    /* Usar toFixed(3) para 3 decimales */\n                    const avgContent = avg !== null ? avg.toFixed(3) : '-'; \n                    html += `<td style=\"text-align: center;\">${avgContent}</td>`;\n                });\n                \n                // TD Puntuación Total - Sin estilo inline de negrita\n                html += `<td class=\"total-score\">${total.toFixed(3)}</td>`; \n\n                html += '</tr>';\n            });\n\n            html += '</tbody></table>';\n            return html;\n        }\n\n\n        \n        loadData(); \n    <\/script>\n</body>\n</html>\n", as:"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Lector XLSX Persistente y Limpio</title>\n    <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap\" rel=\"stylesheet\">\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\">\n    \n    <style>\n        /* Definición de la variable para el borde sutil de la tabla */\n        :root {\n            --border-color: #E0E6ED;\n            --main-blue: #0056b3; /* Variable para el color azul principal */\n        }\n\n        body { \n            font-family: 'Poppins', Arial, sans-serif; /* Usamos Poppins */\n            padding: 20px; \n        }\n        \n        /* Contenedor principal para centrar el contenido (Título y Botones) */\n        .main-container {\n            max-width: 600px; /* Ancho máximo para el contenido principal (título y botones) */\n            margin: 0 auto; /* Centra el contenedor horizontalmente */\n            text-align: center; /* Centra el título H1 */\n        }\n\n        /* ========================================= */\n        /* === ESTILO DEL TÍTULO H1 (GRANDE) === */\n        /* ========================================= */\n        h1 {\n            color: var(--main-blue); \n            font-weight: 800; \n            margin-bottom: 5px; \n            text-align: center; \n            /* Estilos de tamaño y efectos */\n            font-size: 2.5em; /* Más grande */\n            letter-spacing: 2px;\n            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.1); \n            padding: 0 20px; \n        }\n\n        /* === ESTILO DE LÍNEA DIVISORA === */\n        .title-divider {\n            border: none;\n            height: 2px;\n            background-color: var(--main-blue);\n            width: 90%; /* Ancho 90% */\n            margin: 5px auto 25px auto; /* Centra la línea horizontalmente y ajusta márgenes */\n        }\n\n\n        /* ========================================= */\n        /* === ESTILOS DE BOTONES === */\n        /* ========================================= */\n        \n        #fileInput { \n            display: none; \n        }\n        \n        /* Contenedor de botones: Usamos columna para apilarlos */\n        #button-container {\n            display: flex;\n            flex-direction: column; \n            gap: 15px; \n            margin-bottom: 20px;\n            align-items: stretch; \n            text-align: center; \n        }\n        \n        /* Aseguramos que todos los botones y el label de selección ocupen el 100% del ancho del contenedor */\n        #select-file-label,\n        .download-button,\n        .reset-button {\n            width: 100%; \n            box-sizing: border-box; \n            /* Estilo común */\n            color: white;\n            border: none;\n            padding: 12px 20px;\n            border-radius: 9999px;\n            cursor: pointer;\n            font-size: 16px;\n            font-weight: 600; \n            transition: background-color 0.3s;\n            display: inline-flex;\n            align-items: center;\n            justify-content: center; \n        }\n\n        /* Colores específicos */\n        #select-file-label {\n            background-color: #007bff; \n        }\n        #select-file-label:hover {\n            background-color: var(--main-blue);\n        }\n        \n        .download-button { \n            background-color: #28a745; \n        }\n        .download-button:hover {\n            background-color: #1e7e34;\n        }\n\n        .reset-button { \n            background-color: #dc3545; \n        }\n        \n        .reset-button:hover {\n            background-color: #bd2130;\n        }\n\n        /* Espacio para los iconos */\n        #button-container i {\n            margin-right: 8px;\n        }\n\n        /* ========================================= */\n        /* === ESTILOS DE TABLA === */\n        /* ========================================= */\n        #resultadosTabla { \n            width: 100%; \n            border-collapse: collapse; \n            margin-top: 20px; \n            font-size: 14px;\n        }\n        #resultadosTabla th, #resultadosTabla td { \n            border: 1px solid var(--border-color); \n            padding: 10px; \n            text-align: left; \n        }\n        \n        /* Encabezado: Azul Oscuro (#0056b3) y Texto Blanco (#ffffff) */\n        #resultadosTabla th { \n            background-color: var(--main-blue); \n            color: #ffffff;             \n            border-color: #004499;       \n            font-weight: 600;\n        }\n\n        /* Colores Intercalados (Rayas Cebra) */\n        #resultadosTabla tbody tr:nth-child(even) {\n            background-color: #f2f2f2; \n        }\n        #resultadosTabla tbody tr:nth-child(odd) {\n            background-color: #ffffff; \n        }\n        \n        /* Columnas de Ranking y Ptos. (Sin color de fondo, negrita) */\n        .total-col { \n            font-weight: bold; \n            background-color: transparent; \n            color: #000000; \n            text-align: right;\n        } \n        .ranking-col { \n            font-weight: bold; \n            text-align: center; \n            background-color: transparent; \n            color: #000000; \n        }\n.as-mode-selector { display:flex; width:min(320px,calc(100% - 32px)); margin:14px auto 18px; padding:4px; gap:4px; border-radius:9999px; background:#eef1f5; border:1px solid #d9dee7; box-sizing:border-box; }\n        .as-mode-button { flex:1; min-height:40px; border:0; border-radius:9999px; background:transparent; color:#4b5563; font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:all .25s ease; }\n        .as-mode-button.active { background:#007aff; color:#fff; box-shadow:0 2px 8px rgba(0,122,255,.25); }\n        @media (prefers-color-scheme:dark){ .as-mode-selector{background:#1c1c1e;border-color:#3a3a3c}.as-mode-button{color:#d1d1d6}.as-mode-button.active{background:#0a84ff;color:#fff} }\n            </style>\n</head>\n<body onload=\"cargarDatosGuardados()\">\n    \n    <div class=\"main-container\">\n        \n        <h1>Paloma As</h1>\n        \n        <hr class=\"title-divider\">\n\n        <div id=\"button-container\">\n            \n            <input type=\"file\" id=\"fileInput\" accept=\".xlsx\" onchange=\"procesarArchivo()\">\n            <label for=\"fileInput\" id=\"select-file-label\">\n                 <i class=\"fas fa-file-excel\"></i> Seleccionar Archivo\n            </label>\n            \n            <button class=\"download-button\" onclick=\"descargarHtml()\">\n                <i class=\"fas fa-download\"></i> Descargar HTML\n            </button>\n\n            <button class=\"reset-button\" onclick=\"reiniciarDatos()\">\n                <i class=\"fas fa-trash-alt\"></i> Borrar Historial\n            </button>\n        </div>\n    </div>\n\n    <div class=\"as-mode-selector\" role=\"group\" aria-label=\"Método de clasificación\">\n        <button type=\"button\" class=\"as-mode-button active\" data-mode=\"marcas\" onclick=\"cambiarModoAS('marcas')\">Marcas</button>\n        <button type=\"button\" class=\"as-mode-button\" data-mode=\"puntos\" onclick=\"cambiarModoAS('puntos')\">Puntos</button>\n    </div>\n    \n    <table id=\"resultadosTabla\">\n        <thead>\n            <tr>\n                <th></th> \n                \n                </tr>\n        </thead>\n        <tbody>\n            </tbody>\n    </table>\n\n    <script>\n        // Claves de almacenamiento local\n        const DATA_STORAGE_KEY = 'xlsxDataStore';\n        const HEADERS_STORAGE_KEY = 'xlsxFileHeaders';\n\n        // Variables de estado\n        let dataStore = {}; \n        let fileHeaders = [];\n        const AS_MODE_STORAGE_KEY = 'palomaAsMode';\n        let asMode = localStorage.getItem(AS_MODE_STORAGE_KEY) || 'marcas';\n        if (asMode !== 'marcas' && asMode !== 'puntos') asMode = 'marcas';\n\n        function actualizarModoASUI() {\n            document.querySelectorAll('.as-mode-button').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === asMode));\n        }\n\n        function cambiarModoAS(mode) {\n            if (mode !== 'marcas' && mode !== 'puntos') return;\n            asMode = mode;\n            localStorage.setItem(AS_MODE_STORAGE_KEY, asMode);\n            actualizarModoASUI();\n            generarTabla();\n        }\n\n        function obtenerVelocidadesGanadoras() {\n            return fileHeaders.map((_, fileIndex) => {\n                let max = 0;\n                Object.values(dataStore).forEach(item => {\n                    const v = Number(item.points[fileIndex]) || 0;\n                    if (v > max) max = v;\n                });\n                return max;\n            });\n        }\n\n        function valoresSegunModo(item, ganadoras) {\n            if (asMode === 'puntos') {\n                return item.points.map((velocidad, i) => {\n                    const primera = ganadoras[i] || 0;\n                    return primera > 0 ? ((Number(velocidad) || 0) * 1000) / primera : 0;\n                });\n            }\n            return item.points.map(v => Number(v) || 0);\n        }\n        \n        // Función de interfaz de usuario: Se encarga de mostrar el nombre del archivo en la etiqueta\n        function actualizarLabelArchivo(fileName = null) {\n            const label = document.getElementById('select-file-label');\n            if (fileName) {\n                label.innerHTML = `<i class=\"fas fa-file-excel\"></i> Archivo procesando: <b>${fileName}</b>`;\n            } else {\n                label.innerHTML = `<i class=\"fas fa-file-excel\"></i> Seleccionar Archivo`;\n            }\n        }\n\n        /**\n         * Función auxiliar para limpiar el nombre del archivo.\n         */\n        function cleanFileName(fileName) {\n            if (fileName.toLowerCase().endsWith('.xlsx')) {\n                return fileName.slice(0, -5); \n            }\n            return fileName;\n        }\n\n        // Función para cargar datos desde localStorage al cargar la página\n        function cargarDatosGuardados() {\n            actualizarModoASUI();\n            const storedData = localStorage.getItem(DATA_STORAGE_KEY);\n            const storedHeaders = localStorage.getItem(HEADERS_STORAGE_KEY);\n\n            if (storedData && storedHeaders) {\n                try {\n                    dataStore = JSON.parse(storedData);\n                    fileHeaders = JSON.parse(storedHeaders);\n                    generarTabla();\n                    return true;\n                } catch (e) {\n                    console.error(\"Error al parsear datos guardados:\", e);\n                    reiniciarDatos(false); \n                }\n            }\n            generarTabla(); \n            actualizarLabelArchivo(); \n            return false;\n        }\n\n        // Función para guardar datos en localStorage\n        function guardarDatos() {\n            localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(dataStore));\n            localStorage.setItem(HEADERS_STORAGE_KEY, JSON.stringify(fileHeaders));\n        }\n\n        // Función para reiniciar el proceso\n        function reiniciarDatos(confirmar = true) {\n            if (confirmar && !confirm('¿Estás seguro de que quieres borrar todos los datos acumulados y empezar de nuevo?')) {\n                return;\n            }\n            localStorage.removeItem(DATA_STORAGE_KEY);\n            localStorage.removeItem(HEADERS_STORAGE_KEY);\n            dataStore = {};\n            fileHeaders = [];\n            generarTabla();\n            document.getElementById('fileInput').value = ''; \n            actualizarLabelArchivo(); \n            alert('Datos reiniciados.');\n        }\n\n\n        // Función principal para leer y procesar el nuevo archivo\n        function procesarArchivo() {\n            const fileInput = document.getElementById('fileInput');\n            const file = fileInput.files[0];\n\n            if (!file) {\n                actualizarLabelArchivo();\n                return;\n            }\n\n            // 1. Actualizar la etiqueta inmediatamente para indicar que la carga ha comenzado\n            actualizarLabelArchivo(file.name);\n            \n            // 2. Cargar datos existentes\n            cargarDatosGuardados();\n\n            const fileName = file.name;\n            let shouldProcess = true;\n\n            // 3. Verificar si el archivo ya fue cargado\n            if (fileHeaders.includes(fileName)) {\n                if (!confirm(`El archivo \"${fileName}\" ya fue cargado. ¿Quieres reemplazarlo y volver a procesarlo?`)) {\n                    shouldProcess = false;\n                }\n            }\n\n            if (!shouldProcess) {\n                fileInput.value = ''; \n                actualizarLabelArchivo();\n                return;\n            }\n\n            const reader = new FileReader();\n\n            reader.onload = function(e) {\n                const data = new Uint8Array(e.target.result);\n                const workbook = XLSX.read(data, { type: 'array' });\n                \n                const nombreHoja = workbook.SheetNames[0];\n                const worksheet = workbook.Sheets[nombreHoja];\n\n                const excelData = XLSX.utils.sheet_to_json(worksheet, { \n                    header: 1, \n                    range: 0,   \n                    defval: \"\"  \n                });\n\n                let fileIndex = fileHeaders.indexOf(fileName);\n\n                // Determinar el índice\n                if (fileIndex === -1) {\n                    fileHeaders.push(fileName);\n                    fileIndex = fileHeaders.length - 1;\n                }\n                \n                // Ajuste de la Estructura de Datos\n                if (fileIndex === fileHeaders.length - 1) {\n                    Object.values(dataStore).forEach(item => {\n                        item.points.push(0); \n                    });\n                } else {\n                    Object.values(dataStore).forEach(item => {\n                        item.points[fileIndex] = 0; \n                    });\n                }\n                \n                // Procesar filas del archivo actual\n                if (excelData.length > 1) {\n                    for (let row = 1; row < excelData.length; row++) {\n                        const fila = excelData[row];\n                        // Columnas: E=4, N=13, S=18 (A=0)\n                        const columnaN = (fila[13] || '').toString().trim();\n                        const columnaE = (fila[4] || '').toString().trim();\n                        const columnaS = parseFloat(fila[18]) || 0;           \n\n                        if (!columnaN || !columnaE) continue; \n\n                        const key = columnaN + '|' + columnaE;\n\n                        if (!dataStore[key]) {\n                            dataStore[key] = {\n                                N: columnaN,\n                                E: columnaE,\n                                points: new Array(fileHeaders.length).fill(0) \n                            };\n                        }\n                        \n                        dataStore[key].points[fileIndex] = columnaS;\n                    }\n                }\n                \n                // 4. Guardar y Redibujar\n                guardarDatos();\n                generarTabla();\n                \n                // 5. Restablecer el estado del input file y la etiqueta \n                fileInput.value = ''; \n                actualizarLabelArchivo(); \n            };\n\n            reader.readAsArrayBuffer(file);\n        }\n\n        // Función para generar la tabla\n        function generarTabla() {\n            const thead = document.getElementById('resultadosTabla').getElementsByTagName('thead')[0];\n            const tbody = document.getElementById('resultadosTabla').getElementsByTagName('tbody')[0];\n            thead.innerHTML = ''; \n            tbody.innerHTML = ''; \n\n            if (Object.keys(dataStore).length === 0) {\n                 thead.innerHTML = ''; \n                 // colspan ajustado de 4 a 3 (eliminando la columna de Ranking del conteo de headers fijos)\n                 tbody.innerHTML = `<tr><td colspan=\"${fileHeaders.length + 3}\" style=\"text-align: center;\">Aún no se ha cargado ningún dato.</td></tr>`;\n                 return;\n            }\n            \n            // 1. Preparar y Ordenar Datos. En Puntos, cada vuelo usa como referencia su primera velocidad (= 1000).\n            const velocidadesGanadoras = obtenerVelocidadesGanadoras();\n            let datosParaOrdenar = Object.values(dataStore).map(item => {\n                const displayPoints = valoresSegunModo(item, velocidadesGanadoras);\n                const totalPoints = displayPoints.reduce((sum, current) => sum + current, 0);\n                return { ...item, displayPoints: displayPoints, totalPoints: totalPoints }; \n            });\n\n            // Ordenamiento: Mayor a Menor Puntuación Total\n            datosParaOrdenar.sort((a, b) => b.totalPoints - a.totalPoints);\n\n\n            // 2. Generar encabezados de la tabla\n            const headerRow = thead.insertRow();\n            \n            // Columna 1: Ranking (VACÍA)\n            headerRow.insertCell().outerHTML = '<th></th>'; \n            \n            // Socio/Miembro y Número\n            headerRow.insertCell().outerHTML = '<th>Socio/Miembro</th>'; \n            headerRow.insertCell().outerHTML = '<th>Número</th>';       \n            \n            // Columnas de puntos por cada archivo (Encabezado Limpio)\n            fileHeaders.forEach(fileName => {\n                const cleanName = cleanFileName(fileName); \n                headerRow.insertCell().outerHTML = `<th>${cleanName}</th>`;\n            });\n\n            // Columna FINAL: Puntos Totales\n            headerRow.insertCell().outerHTML = `<th class=\"total-col\">${asMode === 'puntos' ? 'Puntos' : 'Ptos.'}</th>`;\n\n            // 3. Generar cuerpo de la tabla\n            datosParaOrdenar.forEach((item, index) => {\n                const tr = tbody.insertRow();\n                \n                // Columna 1: Ranking (Posición index + 1)\n                tr.insertCell().outerHTML = `<td class=\"ranking-col\">${index + 1}</td>`;\n                \n                // Socio/Miembro y Número\n                tr.insertCell().textContent = item.N; \n                tr.insertCell().textContent = item.E; \n                \n                // Columnas de puntos por archivo\n                item.displayPoints.forEach(points => {\n                    const cell = tr.insertCell();\n                    cell.textContent = asMode === 'puntos' ? points.toFixed(3) : points.toFixed(2);\n                    cell.style.textAlign = 'right';\n                });\n\n                // Columna FINAL: conserva el formato actual en Marcas y usa 3 decimales en Puntos.\n                tr.insertCell().outerHTML = `<td class=\"total-col\">${asMode === 'puntos' ? item.totalPoints.toFixed(3) : item.totalPoints.toFixed(2)}</td>`; \n            });\n        }\n        \n        // Función de Descarga HTML\n        function descargarHtml() {\n            const tableHtml = document.getElementById('resultadosTabla').outerHTML;\n            const titleText = document.querySelector('h1').innerText;\n            const downloadFileName = 'Paloma AS.html'; \n\n            if (Object.keys(dataStore).length === 0) {\n                 alert('No hay datos cargados para descargar.');\n                 return;\n            }\n\n            // Estilos esenciales para que el HTML descargado mantenga la apariencia\n            const minimalStyle = `\n                <style>\n                    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');\n                    :root { --border-color: #E0E6ED; --main-blue: #0056b3; }\n                    \n                    body { font-family: 'Poppins', sans-serif; margin: 20px; background-color: white; }\n                    \n                    .summary-title-download {\n                        /* ESTILOS GRANDES DEL TÍTULO */\n                        color: var(--main-blue); \n                        text-align: center; \n                        font-weight: 800; \n                        font-size: 2.5em; \n                        letter-spacing: 2px;\n                        text-shadow: 0 2px 2px rgba(0, 0, 0, 0.1); \n                        margin-top: 20px;\n                        margin-bottom: 5px; \n                        padding: 0 20px;\n                    }\n\n                    .download-divider { \n                        border: none;\n                        height: 2px; \n                        background-color: var(--main-blue);\n                        width: 90%; /* Ancho 90% en el archivo descargado */\n                        margin: 5px auto 20px auto; /* Centra la línea horizontalmente */\n                    }\n\n                    .title-container-download {\n                         max-width: 600px; \n                         margin: 0 auto;\n                         text-align: center; \n                    }\n                    \n                    table { width: 100%; border-collapse: collapse; margin-top: 15px; }\n                    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; font-size: 14px; }\n                    \n                    /* Estilos de tabla mantenidos */\n                    th { \n                        background-color: var(--main-blue); \n                        color: white; \n                        text-align: left; \n                        font-weight: 600; \n                    }\n                    /* Aseguramos que el primer encabezado (vacío) tenga el color de fondo */\n                    th:first-child { \n                        background-color: var(--main-blue); \n                    }\n                    tr:nth-child(even) { background-color: #f2f2f2; }\n                    .ranking-col { font-weight: bold; text-align: center; }\n                    .total-col { font-weight: bold; text-align: right; }\n                </style>\n            `;\n\n            const htmlContent = `\n                <!DOCTYPE html>\n                <html lang=\"es\">\n                <head>\n                    <meta charset=\"UTF-8\">\n                    <title>${titleText} - Tabla</title> \n                    ${minimalStyle}\n                </head>\n                <body>\n                    <div class=\"title-container-download\">\n                        <h1 class=\"summary-title-download\">${titleText}</h1> \n                        <hr class=\"download-divider\"> </div>\n                    ${tableHtml}\n                </body>\n                </html>\n            `;\n\n            // Crea un Blob para el archivo y simula el clic para descargar\n            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });\n            const link = document.createElement(\"a\");\n
